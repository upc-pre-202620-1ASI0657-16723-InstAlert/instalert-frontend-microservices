name: Frontend CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NG_CLI_ANALYTICS: 'false'

jobs:
  test:
    name: Test ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [account, emergencies, sprint3]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run regression suite
        shell: bash
        run: |
          mkdir -p ci-results
          set -o pipefail
          npm run test:${{ matrix.suite }} 2>&1 | tee ci-results/${{ matrix.suite }}.log
      - name: Save test log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-tests-${{ matrix.suite }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 14
  build:
    name: Production and Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Angular production bundle
        run: npm run build
      - name: Build Docker image
        run: docker build --tag instalert/frontend:ci .
      - name: Save production bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-production
          path: dist/instalert/
          if-no-files-found: error
          retention-days: 14
